name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: routine_tracker
          POSTGRES_PASSWORD: routine_tracker
          POSTGRES_DB: routine_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routine_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://routine_tracker:routine_tracker@localhost:5432/routine_tracker
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @routine-tracker/api prisma:generate
      - run: pnpm --filter @routine-tracker/api exec prisma migrate deploy

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
