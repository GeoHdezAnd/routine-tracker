# Compose lo mergea automático encima de docker-compose.yml — no hace falta -f.
# Cambia api/web a su build stage "dev" y habilita Compose Watch, así
# `docker compose watch` da hot-reload sin instalar nada más que Docker
# (no hace falta Node/pnpm en tu máquina)
services:
  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: rebuild
          path: ./apps/api/package.json

  web:
    build:
      target: dev
    # ports es una lista — Compose concatena listas entre archivos por default,
    # así que sin !override esto SUMARÍA el 5173 al lado del "8080:80" del
    # archivo base (que apunta a nginx, que no existe en el stage dev).
    ports: !override
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/apps/web/src
        - action: sync
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: rebuild
          path: ./apps/web/package.json
